version: "3.8"

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: restaurant-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-restaurant_app}
      MYSQL_USER: ${MYSQL_USER:-restaurant}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    container_name: restaurant-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Next.js App
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: restaurant-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=mysql://restaurant:password@mysql:3306/restaurant_app
      - REDIS_URL=redis://redis:6379
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-your-secret-here-change-in-production}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      - IPAYMU_VA=${IPAYMU_VA}
      - IPAYMU_API_KEY=${IPAYMU_API_KEY}
      - IPAYMU_ENVIRONMENT=${IPAYMU_ENVIRONMENT:-sandbox}
      - IPAYMU_ENV=${IPAYMU_ENV:-${IPAYMU_ENVIRONMENT:-sandbox}}
      - WHATSAPP_SESSION_DIR=/app/whatsapp-session
    volumes:
      - whatsapp_data:/app/whatsapp-session
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # WhatsApp Worker
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: restaurant-worker
    restart: unless-stopped
    environment:
      - DATABASE_URL=mysql://restaurant:password@mysql:3306/restaurant_app
      - REDIS_URL=redis://redis:6379
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-your-secret-here-change-in-production}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      - IPAYMU_VA=${IPAYMU_VA}
      - IPAYMU_API_KEY=${IPAYMU_API_KEY}
      - IPAYMU_ENVIRONMENT=${IPAYMU_ENVIRONMENT:-sandbox}
      - IPAYMU_ENV=${IPAYMU_ENV:-${IPAYMU_ENVIRONMENT:-sandbox}}
      - WHATSAPP_SESSION_DIR=/app/whatsapp-session
    volumes:
      - whatsapp_data:/app/whatsapp-session
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: restaurant-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/certbot/conf:/etc/letsencrypt:ro
      - ./docker/certbot/www:/var/www/certbot:ro
    depends_on:
      - app

volumes:
  mysql_data:
  redis_data:
  whatsapp_data:
