name: Build Desktop Cashier (Windows)

# Builds the Electron cashier installer on GitHub's Windows runner, so the
# production VPS never spends CPU/RAM on electron-builder.
#
#   • Manual run   → Actions ▸ "Build Desktop Cashier (Windows)" ▸ Run workflow
#   • Tag release  → git tag desktop-v1.0.0 && git push origin desktop-v1.0.0
#                    (the .exe is attached to that GitHub Release)
on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows installer (.exe)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install desktop dependencies
        run: npm install --no-audit --no-fund

      - name: Verify Electron entrypoints
        run: |
          node --check main.js
          node --check preload.js

      - name: Build NSIS installer
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No code-signing certificate is configured; publish happens below.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: restopos-cashier-windows-x64
          path: |
            desktop/release/*.exe
            desktop/release/*.blockmap
          if-no-files-found: error
          retention-days: 30

      - name: Attach installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/release/*.exe
          draft: false
          generate_release_notes: true
